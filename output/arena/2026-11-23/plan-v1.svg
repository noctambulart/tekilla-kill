<text x="60" y="66" fill="#203037" font-size="15" text-anchor="start">Proposition #27 · 28 × 16 tuiles · 896 × 512 px · 1 tuile = 32 px</text>
<text x="60" y="89" fill="#203037" font-size="13" text-anchor="start">À examiner avec le producteur — dimensions et équilibrage à éprouver dans Godot</text>

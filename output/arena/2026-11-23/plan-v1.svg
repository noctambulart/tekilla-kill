<title id="title">Arroyo Seco — plan annoté V1</title><desc id="desc">Proposition : quatre bâtiments accessibles par deux portes, rues en croix, bouteille centrale et quatre départs équidistants. Parcours de contournement et raccourci intérieur.</desc>

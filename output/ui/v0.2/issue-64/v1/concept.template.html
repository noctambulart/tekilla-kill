<div id="tk64-concepts">
  <style>
    #tk64-concepts .tk64-tools{display:flex;flex-wrap:wrap;align-items:end;gap:12px;margin-bottom:12px}
    #tk64-concepts .tk64-tools label{flex:1 1 210px}
    #tk64-concepts .tk64-note{margin-bottom:12px}
    #tk64-concepts .tk64-game{--tk-ink:#fff0cb;--tk-surface:#36251d;position:relative;aspect-ratio:16/9;background:#ca8e4e;overflow:hidden;color:var(--tk-ink);font-family:system-ui,-apple-system,sans-serif;container-type:inline-size}
    #tk64-concepts canvas{display:block;width:100%;height:100%}
    #tk64-concepts .tk64-result{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(34,24,19,.87);text-align:center}
    #tk64-concepts .tk64-result[hidden]{display:none}
    #tk64-concepts .tk64-result-inner{width:78%;max-width:620px;display:flex;flex-direction:column;gap:clamp(8px,2cqw,22px)}
    #tk64-concepts .tk64-result h2{color:#fff0cb;font-size:clamp(16px,3.1cqw,34px);font-weight:600;line-height:1.2;margin:0}
    #tk64-concepts .tk64-result .tk64-ending{color:#ddc69f;font-size:clamp(11px,1.7cqw,19px)}
    #tk64-concepts .tk64-scores{display:flex;justify-content:center;gap:clamp(25px,7cqw,80px)}
    #tk64-concepts .tk64-scores div{display:flex;flex-direction:column;gap:5px;font-size:clamp(12px,2cqw,22px)}
    #tk64-concepts .tk64-scores strong{font-size:clamp(24px,5cqw,56px);font-weight:600;font-variant-numeric:tabular-nums}
    #tk64-concepts .tk64-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
    #tk64-concepts .tk64-actions button{appearance:none;border:1px solid #bca079;background:#74523a;color:#fff0cb;border-radius:5px;padding:10px 16px;font:inherit;font-size:clamp(11px,1.8cqw,20px)}
    #tk64-concepts .tk64-actions button:first-child{background:#e7c58a;color:#34251b;border-color:#e7c58a}
    #tk64-concepts .tk64-actions button:focus-visible{outline:3px solid #fff0cb;outline-offset:3px}
    #tk64-concepts .tk64-fallback{padding:12px;font-size:12px}
  </style>
  <div class="tk64-tools">
    <label class="form-label" for="tk64-state">Situation
      <select class="form-select" id="tk64-state">
        <option value="ground">Bouteille au sol</option>
        <option value="poncho" selected>Poncho porteur</option>
        <option value="garcia">Garcia porteur</option>
        <option value="ghost">Poncho fantôme</option>
        <option value="result">Victoire de Poncho</option>
        <option value="tie">Victoire partagée</option>
        <option value="title">Retour au titre</option>
      </select>
    </label>
    <label class="form-label" for="tk64-camera">Cadrage
      <select class="form-select" id="tk64-camera">
        <option value="close">Rapproché</option>
        <option value="far">Éloigné</option>
      </select>
    </label>
  </div>
  <div class="text-small text-muted tk64-note" id="tk64-summary" aria-live="polite">Maquettes sur captures v0.1 · états simulés · proposition à discuter</div>
  <div class="viz-carousel" aria-label="Présentation de la bouteille" data-previous-label="Piste précédente" data-next-label="Piste suivante">
    <section data-variant="Scores près des joueurs" aria-label="Scores près des joueurs">
      <div class="tk64-game" data-design="local" aria-label="Maquette avec scores près des personnages">
        <canvas width="1920" height="1080" role="img" aria-label="Poncho porteur, scores personnels près des personnages et réserve commune en haut">Maquette du round avec bouteille.</canvas>
        <div class="tk64-result" hidden>
          <div class="tk64-result-inner">
            <div class="tk64-ending">Bouteille vide · fin de partie</div>
            <h2>Poncho remporte la partie</h2>
            <div class="tk64-scores"><div>Poncho<strong data-score="1">58 %</strong></div><div>Garcia<strong data-score="2">42 %</strong></div></div>
            <div class="tk64-actions"><button type="button" class="cursor-interaction" data-action="replay">Rejouer</button><button type="button" class="cursor-interaction" data-action="title">Retour au titre</button></div>
          </div>
        </div>
      </div>
    </section>
    <section data-variant="Scores avec la réserve" aria-label="Scores avec la réserve" hidden>
      <div class="tk64-game" data-design="grouped" aria-label="Maquette avec scores regroupés avec la réserve">
        <canvas width="1920" height="1080" role="img" aria-label="Poncho porteur, scores et réserve regroupés sous les commandes">Maquette du round avec bouteille.</canvas>
        <div class="tk64-result" hidden>
          <div class="tk64-result-inner">
            <div class="tk64-ending">Bouteille vide · fin de partie</div>
            <h2>Poncho remporte la partie</h2>
            <div class="tk64-scores"><div>Poncho<strong data-score="1">58 %</strong></div><div>Garcia<strong data-score="2">42 %</strong></div></div>
            <div class="tk64-actions"><button type="button" class="cursor-interaction" data-action="replay">Rejouer</button><button type="button" class="cursor-interaction" data-action="title">Retour au titre</button></div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script>
    (() => {
      const root = document.getElementById('tk64-concepts');
      const stateControl = root.querySelector('#tk64-state');
      const cameraControl = root.querySelector('#tk64-camera');
      const summary = root.querySelector('#tk64-summary');
      const saved = window.openai?.widgetState?.modelContent || {};
      const state = { scene: ['ground','poncho','garcia','ghost','result','tie','title'].includes(saved.scene) ? saved.scene : 'poncho', camera: saved.camera === 'far' ? 'far' : 'close' };
      const scenes = {
        ground: {scores:[0,0],left:100,holder:0,label:'Bouteille au sol'},
        poncho: {scores:[28,25],left:47,holder:1,label:'Poncho porteur'},
        garcia: {scores:[28,31],left:41,holder:2,label:'Garcia porteur'},
        ghost: {scores:[28,31],left:41,holder:2,label:'Poncho fantôme · Garcia porteur'},
        result: {scores:[58,42],left:0,holder:0,label:'Victoire de Poncho'},
        tie: {scores:[50,50],left:0,holder:0,label:'Victoire partagée'},
        title: {scores:[0,0],left:100,holder:0,label:'Retour au titre'}
      };
      const images = {};
      const sources = { close:'__TK_CLOSE__', far:'__TK_FAR__', bottle:'__TK_BOTTLE__', title:'__TK_TITLE__' };
      const games = Array.from(root.querySelectorAll('.tk64-game')).map(el => ({el, canvas:el.querySelector('canvas'), design:el.dataset.design, settings:{markerSize:1,glow:false}}));
      const palette = {ink:'#fff0bd',dark:'#30221b',panel:'rgba(48,34,27,.83)',green:'#93bc61',track:'#514332'};

      function rounded(ctx,x,y,w,h,r=8){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
      function panel(ctx,x,y,w,h){ctx.fillStyle=palette.panel;rounded(ctx,x,y,w,h);ctx.fill();}
      function sample(ctx,image,sx,sy,sw,sh,dx,dy,dw,dh){
        const rx=image.naturalWidth/1920,ry=image.naturalHeight/1080;
        ctx.drawImage(image,sx*rx,sy*ry,sw*rx,sh*ry,dx,dy,dw,dh);
      }
      function ghostSprite(ctx,p,unit,near){
        const x=Math.round(p.x-20*unit),y=Math.round(p.y-20*unit),w=Math.round(40*unit),h=Math.round(37*unit);
        const pixels=ctx.getImageData(x,y,w,h),floor=ctx.getImageData(Math.round(p.x+30*unit),y,1,h);
        for(let j=0;j<h;j++)for(let i=0;i<w;i++){
          const k=(j*w+i)*4,r=pixels.data[k],g=pixels.data[k+1],b=pixels.data[k+2];
          const sprite=near?(r<225||g>210):(r>b*1.05);
          if(sprite){
            const grey=.3*r+.59*g+.11*b;
            [.72,.82,.95].forEach((t,c)=>{pixels.data[k+c]=floor.data[j*4+c]*.62+grey*t*.38;});
          }
        }
        ctx.putImageData(pixels,x,y);
      }
      function text(ctx,value,x,y,size=30,color=palette.ink,align='center'){
        ctx.font=`500 ${size}px system-ui,-apple-system,sans-serif`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillStyle=color;ctx.fillText(value,x,y);
      }
      function bottle(ctx,x,y,height){
        const image=images.bottle;
        if(!image?.complete||!image.naturalWidth)return;
        const width=height*image.naturalWidth/image.naturalHeight;
        ctx.drawImage(image,x-width/2,y-height/2,width,height);
      }
      function drawGame(game){
        const {canvas,design,settings}=game;
        const ctx=canvas.getContext('2d');
        const scene=scenes[state.scene];
        const ending=state.scene==='result'||state.scene==='tie';
        const overlay=game.el.querySelector('.tk64-result');
        overlay.hidden=!ending;
        overlay.querySelector('h2').textContent=state.scene==='tie'?'Victoire partagée':'Poncho remporte la partie';
        overlay.querySelector('[data-score="1"]').textContent=`${scene.scores[0]} %`;
        overlay.querySelector('[data-score="2"]').textContent=`${scene.scores[1]} %`;
        ctx.clearRect(0,0,1920,1080);
        const base=images[state.scene==='title'?'title':state.camera];
        if(!base?.complete||!base.naturalWidth)return;
        ctx.drawImage(base,0,0,1920,1080);
        canvas.setAttribute('aria-label',`${design==='local'?'Scores près des joueurs':'Scores avec la réserve'}. ${scene.label}. Poncho ${scene.scores[0]} pour cent, Garcia ${scene.scores[1]} pour cent, réserve ${scene.left} pour cent. Cadrage ${state.camera==='far'?'éloigné':'rapproché'}. Maquette sur capture réelle, état simulé.`);
        if(state.scene==='title')return;
        const near=state.camera==='close';
        const unit=near?2.55:1.35;
        const points=near?[{x:890,y:548},{x:1029,y:548}]:[{x:252,y:548},{x:1668,y:548}];
        const width=canvas.getBoundingClientRect().width||1024;
        const font=Math.max(30,11*1920/width);

        // Remplacer le libellé de cible par J2 et compléter ses cartouches avec le style courant.
        if(near){sample(ctx,base,990,425,84,32,990,464,84,32);text(ctx,'J2',1029,481,26,palette.dark);}
        else{sample(ctx,base,1480,500,50,24,1642,500,50,24);text(ctx,'J2',1668,513,14,palette.dark);}
        const garcia=points[1];
        for(let i=0;i<6;i++){ctx.fillStyle='#ffe8a1';ctx.fillRect(garcia.x+(-12+i*4)*unit,garcia.y+29*unit,3*unit,4*unit);}

        // Le fantôme est une simulation graphique de la présentation existante, pas un état du moteur.
        if(state.scene==='ghost'){
          const p=points[0];
          ghostSprite(ctx,p,unit,near);
          ctx.fillStyle=palette.dark;ctx.fillRect(p.x-13*unit,p.y+22*unit,26*unit,4*unit);
          ctx.fillStyle='#9fca74';ctx.fillRect(p.x-12*unit,p.y+23*unit,24*unit*.38,2*unit);
        }

        // Une seule réserve commune, sous les commandes existantes.
        if(design==='local'){
          const w=Math.max(312,font*9),h=Math.max(70,font+30),x=960-w/2;
          panel(ctx,x,105,w,h);
          bottle(ctx,x+36,105+h/2,Math.max(58,font));
          text(ctx,`${scene.left} %`,x+w*.65,105+h/2-7,font);
          ctx.fillStyle=palette.track;ctx.fillRect(x+70,105+h-12,w-100,6);
          ctx.fillStyle=palette.green;ctx.fillRect(x+70,105+h-12,(w-100)*scene.left/100,6);
          points.forEach((p,i)=>{
            const badgeWidth=Math.max(90,font*2.8);
            const badgeHeight=font+12;
            const stagger=i===1&&Math.abs(points[1].x-points[0].x)<badgeWidth+8?badgeHeight+6:0;
            const y=p.y+33*unit+6+badgeHeight/2+stagger;
            panel(ctx,p.x-badgeWidth/2,y-badgeHeight/2,badgeWidth,badgeHeight);
            text(ctx,`${scene.scores[i]} %`,p.x,y,font);
          });
        }else{
          const w=Math.max(620,font*22),h=Math.max(70,font+30),y=105+h/2;
          panel(ctx,960-w/2,105,w,h);
          text(ctx,`J1  ${scene.scores[0]} %`,960-w*.33,y,font);
          bottle(ctx,960-font-13,y,Math.max(58,font));
          text(ctx,`${scene.left} %`,960+font*1.5,y-7,font);
          text(ctx,`J2  ${scene.scores[1]} %`,960+w*.33,y,font);
          ctx.fillStyle=palette.track;ctx.fillRect(945,105+h-12,115,6);
          ctx.fillStyle=palette.green;ctx.fillRect(945,105+h-12,115*scene.left/100,6);
        }

        // Repère de possession autour des pieds ; la vie et les cartouches restent dégagées.
        if(scene.holder&&!ending){
          const p=points[scene.holder-1],factor=settings.markerSize;
          ctx.save();
          if(settings.glow){ctx.shadowColor='#fff0bd';ctx.shadowBlur=16;}
          ctx.strokeStyle=palette.ink;ctx.lineWidth=3;
          ctx.beginPath();ctx.ellipse(p.x,p.y+16*unit,17*unit*factor,5*unit*factor,0,0,Math.PI*2);ctx.stroke();
          ctx.restore();
          const by=p.y-39*unit;
          bottle(ctx,p.x,by,26*unit*factor);
          ctx.strokeStyle=palette.ink;ctx.lineWidth=2;
          [[-15,-4],[15,-4]].forEach(([dx,dy])=>{ctx.beginPath();ctx.moveTo(p.x+(dx-2)*unit,by+dy*unit);ctx.lineTo(p.x+(dx+2)*unit,by+dy*unit);ctx.stroke();});
        }else if(!ending){
          const bx=960,by=735,scale=near?2.55:1.8;
          ctx.strokeStyle=palette.ink;ctx.lineWidth=3;
          ctx.beginPath();ctx.ellipse(bx,by+12*scale,17*scale*settings.markerSize,5*scale*settings.markerSize,0,0,Math.PI*2);ctx.stroke();
          bottle(ctx,bx,by,30*scale*settings.markerSize);
        }
      }
      function render(){
        stateControl.value=state.scene;cameraControl.value=state.camera;
        games.forEach(drawGame);
        summary.textContent=`Maquettes sur captures v0.1 · ${scenes[state.scene].label} · états simulés · proposition à discuter`;
      }
      function persist(){window.openai?.setWidgetState?.({modelContent:{scene:state.scene,camera:state.camera},privateContent:null})?.catch(()=>{});}
      stateControl.addEventListener('change',()=>{state.scene=stateControl.value;render();persist();});
      cameraControl.addEventListener('change',()=>{state.camera=cameraControl.value;render();persist();});
      root.querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',()=>{state.scene=button.dataset.action==='replay'?'ground':'title';render();persist();}));
      window.addEventListener('openai:set_globals',event=>{
        const data=event.detail?.globals?.widgetState?.modelContent;
        if(data&&scenes[data.scene]){state.scene=data.scene;state.camera=data.camera==='far'?'far':'close';render();}
      });
      for(const [key,src] of Object.entries(sources)){const image=new Image();images[key]=image;image.onload=render;image.src=src;}
      const observer=new ResizeObserver(render);games.forEach(g=>observer.observe(g.el));
      render();
      if(globalThis.Tweak){
        games.forEach(game=>{
          const tweak=new Tweak({container:game.el,onChange:render});
          tweak.addSlider(game.settings,'markerSize',{label:'Taille du repère bouteille',min:.8,max:1.25,step:.05,reference:'markerSize'});
          tweak.addToggle(game.settings,'glow',{label:'Halo discret du porteur',reference:'glow'});
        });
      }
    })();
  </script>
</div>
